# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Language & Timezone
lang: en
timezone: UTC

# SEO & Meta settings
title: AI Quick Reference
tagline: AI, LLM & Agent Systems Architecture
description: >-
  Curated architectural quick reference guides covering autonomous AI agents,
  LLM inference, RAG systems, Model Context Protocol (MCP), and production engineering architectures.

# URL & Baseurl for GitHub Pages project site
url: "https://patrikbego.github.io"
baseurl: "/ai-quick-ref"

# Author & Social links
github:
  username: patrikbego

social:
  name: Patrik Bego
  links:
    - https://github.com/patrikbego/ai-quick-ref

# Color scheme: dark by default, with sidebar toggle enabled
theme_mode: dark

# PWA
pwa:
  enabled: false

# Collections: sidebar tabs
collections:
  tabs:
    output: true
    sort_by: order

# Default layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      toc: true
      permalink: /:title/

# Markdown & Syntax Highlighting
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Excluded paths
exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - LICENSE
  - scripts
  - AGENTS.md
  - MAINTENANCE.md
  - purgecss.js
  - "*.config.js"
  - "package*.json"
