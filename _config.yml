title: AI Quick Reference
description: Curated quick reference guides on AI, LLMs, and Agents from ByteByteGo
remote_theme: just-the-docs/just-the-docs

# Color scheme
color_scheme: dark

# Enable search
search_enabled: true
search:
  heading_level: 3
  previews: 3

# Heading anchors
heading_anchors: true

# Enable callouts
callouts:
  note:
    title: Note
    color: purple
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: blue
  warning:
    title: Warning
    color: red

# Auxiliary links in navigation header
aux_links:
  "GitHub Repository": "https://github.com/patrikbego/ai-quick-ref"

# Footer content
footer_content: "Curated AI quick references from ByteByteGo newsletters."
